version: '3.8'

services:
  # PostgreSQL database for development
  db:
    image: postgres:16-alpine
    container_name: myapp-db-dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: myapp_dev
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', 'localhost', '-p', '5432', '-U', 'dev']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - myapp-dev

  # Node.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: myapp-app-dev
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env.development
    volumes:
      # Mount source code for development hot-reload
      - .:/app
      - /app/node_modules
      # Mount logs directory
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - myapp-dev
    restart: unless-stopped

networks:
  myapp-dev:
    driver: bridge

volumes:
  db-data:
